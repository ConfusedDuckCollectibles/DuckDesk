name: Publish desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v
        required: true
        default: "0.1.0-alpha.6"
        type: string
      prerelease:
        description: Mark this release as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-mac:
    name: Build Mac DMG
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          echo "package.json version: ${PACKAGE_VERSION}"
          echo "workflow input version: ${RELEASE_VERSION}"
          test "$PACKAGE_VERSION" = "$RELEASE_VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Apple-silicon DMG
        run: npm run mac:dmg

      - name: Create checksum
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          cd apps/desktop/release
          DMG="DuckDesk-${RELEASE_VERSION}-arm64.dmg"
          if [ ! -f "$DMG" ]; then
            SOURCE_DMG="Duck Desk-${RELEASE_VERSION}-arm64.dmg"
            test -f "$SOURCE_DMG"
            mv "$SOURCE_DMG" "$DMG"
          fi
          LC_ALL=C LANG=C shasum -a 256 "$DMG" > "${DMG}.sha256"

      - name: Upload Mac installer
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: |
            apps/desktop/release/DuckDesk-${{ inputs.version }}-arm64.dmg
            apps/desktop/release/DuckDesk-${{ inputs.version }}-arm64.dmg.sha256
          if-no-files-found: error

  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Verify release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          echo "package.json version: ${PACKAGE_VERSION}"
          echo "workflow input version: ${RELEASE_VERSION}"
          test "$PACKAGE_VERSION" = "$RELEASE_VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Windows NSIS installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run win:nsis

      - name: Create checksum
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          cd apps/desktop/release
          EXE="DuckDesk-${RELEASE_VERSION}-windows-x64.exe"
          if [ ! -f "$EXE" ]; then
            echo "Expected $EXE. Files in release:"
            ls -la
            exit 1
          fi
          sha256sum "$EXE" > "${EXE}.sha256"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: |
            apps/desktop/release/DuckDesk-${{ inputs.version }}-windows-x64.exe
            apps/desktop/release/DuckDesk-${{ inputs.version }}-windows-x64.exe.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: dist-installers
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          TAG="v${RELEASE_VERSION}"
          ASSETS=(
            dist-installers/DuckDesk-${RELEASE_VERSION}-arm64.dmg
            dist-installers/DuckDesk-${RELEASE_VERSION}-arm64.dmg.sha256
            dist-installers/DuckDesk-${RELEASE_VERSION}-windows-x64.exe
            dist-installers/DuckDesk-${RELEASE_VERSION}-windows-x64.exe.sha256
          )
          echo "Release files:"
          ls -lh dist-installers
          for asset in "${ASSETS[@]}"; do
            test -f "$asset"
            test -s "$asset"
          done
          if [ "$PRERELEASE" = "true" ]; then
            CHANNEL_ARGS=(--prerelease --latest=false)
          else
            CHANNEL_ARGS=(--prerelease=false --latest)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Duck Desk ${TAG}" \
              --notes-file RELEASE_NOTES.md \
              "${CHANNEL_ARGS[@]}"
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Duck Desk ${TAG}" \
              --notes-file RELEASE_NOTES.md \
              "${CHANNEL_ARGS[@]}"
          fi

          RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .id)"

          delete_asset_named() {
            local name="$1"
            local asset_id
            asset_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              --jq ".assets[] | select(.name==\"${name}\") | .id" | head -n 1 || true)"
            if [ -n "${asset_id}" ]; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" >/dev/null
            fi
          }

          upload_one() {
            local path="$1"
            local name
            name="$(basename "$path")"
            local attempt
            for attempt in 1 2 3 4; do
              delete_asset_named "$name"
              if gh release upload "$TAG" "$path"; then
                return 0
              fi
              echo "Upload of ${name} failed on attempt ${attempt}; retrying..."
              sleep $((attempt * 8))
            done
            echo "Giving up on ${name}"
            return 1
          }

          # HTTP/2 uploads to uploads.github.com can 400 on larger binaries.
          export GODEBUG=http2client=0
          for asset in "${ASSETS[@]}"; do
            upload_one "$asset"
          done
